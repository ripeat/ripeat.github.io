<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-label="How a ripeat command flows: profile, recipes, plan, engine; the plan is rated for risk and checked against the administrator policy; the engine uses backends and writes the journal">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e0083f"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a8f9c"/></marker></defs>
<text x="117" y="34" text-anchor="middle" font-size="15" letter-spacing="1.2" fill="#e0083f" font-weight="700">WHAT YOU WANT</text>
<text x="372" y="34" text-anchor="middle" font-size="15" letter-spacing="1.2" fill="#e0083f" font-weight="700">HOW TO GET IT</text>
<text x="627" y="34" text-anchor="middle" font-size="15" letter-spacing="1.2" fill="#e0083f" font-weight="700">WHAT IT MEANS</text>
<text x="882" y="34" text-anchor="middle" font-size="15" letter-spacing="1.2" fill="#e0083f" font-weight="700">WHAT HAPPENS</text>
<rect x="10" y="52" width="215" height="124" rx="14" fill="rgba(224,8,63,0.10)" stroke="#e0083f" stroke-width="2.5"/>
<text x="117" y="90" text-anchor="middle" font-size="23" font-weight="700" fill="#6f7482">Profile</text>
<text x="117" y="120" text-anchor="middle" font-size="16" fill="#6f7482">your list of tools:</text>
<text x="117" y="142" text-anchor="middle" font-size="16" fill="#6f7482">ripeat.yaml or names</text>
<rect x="265" y="52" width="215" height="124" rx="14" fill="rgba(224,8,63,0.10)" stroke="#e0083f" stroke-width="2.5"/>
<text x="372" y="90" text-anchor="middle" font-size="23" font-weight="700" fill="#6f7482">Recipes</text>
<text x="372" y="120" text-anchor="middle" font-size="16" fill="#6f7482">built-in, packs,</text>
<text x="372" y="142" text-anchor="middle" font-size="16" fill="#6f7482">and your own</text>
<rect x="520" y="52" width="215" height="124" rx="14" fill="rgba(224,8,63,0.10)" stroke="#e0083f" stroke-width="2.5"/>
<text x="627" y="90" text-anchor="middle" font-size="23" font-weight="700" fill="#6f7482">Plan</text>
<text x="627" y="120" text-anchor="middle" font-size="16" fill="#6f7482">ordered steps,</text>
<text x="627" y="142" text-anchor="middle" font-size="16" fill="#6f7482">dependencies,</text>
<text x="627" y="164" text-anchor="middle" font-size="16" fill="#6f7482">fallbacks</text>
<rect x="775" y="52" width="215" height="124" rx="14" fill="rgba(224,8,63,0.10)" stroke="#e0083f" stroke-width="2.5"/>
<text x="882" y="90" text-anchor="middle" font-size="23" font-weight="700" fill="#6f7482">Engine</text>
<text x="882" y="120" text-anchor="middle" font-size="16" fill="#6f7482">asks, takes the lock,</text>
<text x="882" y="142" text-anchor="middle" font-size="16" fill="#6f7482">journals, runs steps</text>
<line x1="229" y1="114" x2="253" y2="114" stroke="#e0083f" stroke-width="3" marker-end="url(#a)"/>
<line x1="484" y1="114" x2="508" y2="114" stroke="#e0083f" stroke-width="3" marker-end="url(#a)"/>
<line x1="739" y1="114" x2="763" y2="114" stroke="#e0083f" stroke-width="3" marker-end="url(#a)"/>
<rect x="520" y="226" width="215" height="124" rx="14" fill="rgba(128,128,140,0.13)" stroke="#8a8f9c" stroke-width="2.5"/>
<text x="627" y="264" text-anchor="middle" font-size="23" font-weight="700" fill="#6f7482">Risk rating</text>
<text x="627" y="294" text-anchor="middle" font-size="16" fill="#6f7482">LOW to BLOCKED,</text>
<text x="627" y="316" text-anchor="middle" font-size="16" fill="#6f7482">in plain rules</text>
<rect x="520" y="400" width="215" height="124" rx="14" fill="rgba(128,128,140,0.13)" stroke="#8a8f9c" stroke-width="2.5"/>
<text x="627" y="438" text-anchor="middle" font-size="23" font-weight="700" fill="#6f7482">Admin policy</text>
<text x="627" y="468" text-anchor="middle" font-size="16" fill="#6f7482">limits methods, hosts,</text>
<text x="627" y="490" text-anchor="middle" font-size="16" fill="#6f7482">tools; no override</text>
<rect x="775" y="226" width="215" height="124" rx="14" fill="rgba(128,128,140,0.13)" stroke="#8a8f9c" stroke-width="2.5"/>
<text x="882" y="264" text-anchor="middle" font-size="23" font-weight="700" fill="#6f7482">Backends</text>
<text x="882" y="294" text-anchor="middle" font-size="16" fill="#6f7482">apt, brew, winget,</text>
<text x="882" y="316" text-anchor="middle" font-size="16" fill="#6f7482">downloads, installers</text>
<rect x="775" y="400" width="215" height="124" rx="14" fill="rgba(128,128,140,0.13)" stroke="#8a8f9c" stroke-width="2.5"/>
<text x="882" y="438" text-anchor="middle" font-size="23" font-weight="700" fill="#6f7482">Journal</text>
<text x="882" y="468" text-anchor="middle" font-size="16" fill="#6f7482">written before acting;</text>
<text x="882" y="490" text-anchor="middle" font-size="16" fill="#6f7482">rollback reads it</text>
<line x1="627" y1="179" x2="627" y2="214" stroke="#8a8f9c" stroke-width="3" marker-end="url(#b)"/>
<line x1="627" y1="353" x2="627" y2="388" stroke="#8a8f9c" stroke-width="3" marker-end="url(#b)"/>
<line x1="882" y1="179" x2="882" y2="214" stroke="#8a8f9c" stroke-width="3" marker-end="url(#b)"/>
<line x1="882" y1="353" x2="882" y2="388" stroke="#8a8f9c" stroke-width="3" marker-end="url(#b)"/>
<text x="10" y="565" font-size="16" fill="#6f7482">plan and assess stop at the plan. install runs the whole line. rollback reads the journal backwards.</text>
</svg>
